<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book an Appointment</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="top">
    <div class="brand">
        Shree Bhagwant
        <small>Superspeciality Hospital</small>
    </div>

    <a href="index.html">← Back to Site</a>
</nav>


<div class="wrap" style="max-width:640px">

    <div style="text-align:center;margin:10px 0 24px">

        <h1>Book an Appointment</h1>

        <p style="color:var(--mute)">
            Fill in your details below and we'll confirm your appointment promptly.
        </p>

    </div>


    <div class="card">

        <div id="msg" class="msg"></div>


        <form id="appointmentForm">

            <!-- Patient Name -->
            <div class="two">

                <div class="field">

                    <label>Patient Name *</label>

                    <input
                        id="patientName"
                        type="text"
                        placeholder="Full name"
                        required
                    >

                </div>


                <!-- Phone -->
                <div class="field">

                    <label>Phone Number *</label>

                    <input
                        id="phone"
                        type="text"
                        placeholder="10-digit number"
                        maxlength="10"
                        pattern="[0-9]{10}"
                        required
                    >

                </div>

            </div>


            <!-- Email -->
            <div class="field">

                <label>Email Address (Optional)</label>

                <input
                    id="email"
                    type="email"
                    placeholder="your@email.com"
                >

            </div>


            <!-- Doctor -->
            <div class="field">

                <label>Select Doctor *</label>

                <select id="doctor" required>

                    <option value="">
                        -- Choose a doctor --
                    </option>

                </select>

            </div>


            <!-- Date + Time -->
            <div class="two">

                <div class="field">

                    <label>Preferred Date *</label>

                    <input
                        id="date"
                        type="date"
                        required
                    >

                </div>


                <div class="field">

                    <label>Time Slot *</label>

                    <select id="slot" required>

                        <option value="">
                            -- Select time --
                        </option>

                    </select>

                </div>

            </div>


            <!-- Reason -->
            <div class="field">

                <label>Reason / Chief Complaint (Optional)</label>

                <textarea
                    id="reason"
                    rows="3"
                    placeholder="Describe your symptoms or reason for visit..."
                ></textarea>

            </div>


            <!-- Submit -->
            <button
                type="submit"
                class="btn"
                style="width:100%;justify-content:center"
            >
                Confirm Appointment
            </button>

        </form>

    </div>

</div>


<script src="js/api.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {

    /* -------------------------------
       GET HTML ELEMENTS
    -------------------------------- */

    const msg = document.getElementById("msg");

    const appointmentForm =
        document.getElementById("appointmentForm");

    const patientNameInput =
        document.getElementById("patientName");

    const phoneInput =
        document.getElementById("phone");

    const emailInput =
        document.getElementById("email");

    const doctorSelect =
        document.getElementById("doctor");

    const dateInput =
        document.getElementById("date");

    const slotSelect =
        document.getElementById("slot");

    const reasonInput =
        document.getElementById("reason");


    /* -------------------------------
       SET MINIMUM DATE
    -------------------------------- */

    const today =
        new Date().toISOString().slice(0, 10);

    dateInput.min = today;


    /* -------------------------------
       MESSAGE FUNCTION
    -------------------------------- */

    function showMessage(type, message) {

        msg.className = "msg " + type;

        msg.textContent = message;

        msg.style.display = "block";
    }


    /* -------------------------------
       LOAD DOCTORS
    -------------------------------- */

    async function loadDoctors() {

        try {

            const doctors = await api("/doctors");

            doctorSelect.innerHTML =
                '<option value="">-- Choose a doctor --</option>';

            doctors.forEach(function (doctor) {

                const option =
                    document.createElement("option");

                option.value = doctor.doctor_id;

                option.textContent =
                    doctor.name + " — " +
                    doctor.specialization;

                doctorSelect.appendChild(option);

            });

        } catch (error) {

            console.error(error);

            showMessage(
                "err",
                "Cannot load doctors. Please start the backend."
            );

        }

    }


    /* -------------------------------
       LOAD AVAILABLE SLOTS
    -------------------------------- */

    async function loadSlots() {

        slotSelect.innerHTML =
            '<option value="">-- Select time --</option>';

        if (
            doctorSelect.value === "" ||
            dateInput.value === ""
        ) {
            return;
        }


        try {

            const slots = await api(
                "/slots?doctor_id=" +
                encodeURIComponent(doctorSelect.value) +
                "&date=" +
                encodeURIComponent(dateInput.value)
            );


            slots.forEach(function (item) {

                const option =
                    document.createElement("option");

                option.value = item.time;

                if (item.available) {

                    option.textContent = item.time;

                    option.disabled = false;

                } else {

                    option.textContent =
                        item.time + " (booked)";

                    option.disabled = true;

                }

                slotSelect.appendChild(option);

            });

        } catch (error) {

            console.error(error);

            showMessage(
                "err",
                "Cannot load available time slots."
            );

        }

    }


    /* -------------------------------
       DOCTOR / DATE CHANGE
    -------------------------------- */

    doctorSelect.addEventListener(
        "change",
        loadSlots
    );

    dateInput.addEventListener(
        "change",
        loadSlots
    );


    /* -------------------------------
       FORM SUBMIT
    -------------------------------- */

    appointmentForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            /*
              IMPORTANT:
              There is NO .trim() anywhere
              in this file.
            */

            const patientName =
                patientNameInput.value || "";

            const phone =
                phoneInput.value || "";

            const email =
                emailInput.value || "";

            const doctorId =
                doctorSelect.value || "";

            const appointmentDate =
                dateInput.value || "";

            const timeSlot =
                slotSelect.value || "";

            const reason =
                reasonInput.value || "";


            /* -------------------------------
               BASIC VALIDATION
            -------------------------------- */

            if (patientName === "") {

                showMessage(
                    "err",
                    "Please enter patient name."
                );

                return;
            }


            if (phone === "") {

                showMessage(
                    "err",
                    "Please enter phone number."
                );

                return;
            }


            if (phone.length !== 10) {

                showMessage(
                    "err",
                    "Phone number must contain 10 digits."
                );

                return;
            }


            if (doctorId === "") {

                showMessage(
                    "err",
                    "Please select a doctor."
                );

                return;
            }


            if (appointmentDate === "") {

                showMessage(
                    "err",
                    "Please select an appointment date."
                );

                return;
            }


            if (timeSlot === "") {

                showMessage(
                    "err",
                    "Please select a time slot."
                );

                return;
            }


            /* -------------------------------
               SEND APPOINTMENT
            -------------------------------- */

            try {

                await api(
                    "/appointments",
                    {
                        method: "POST",

                        body: {
                            name: patientName,
                            phone: phone,
                            email: email,
                            doctor_id: doctorId,
                            date: appointmentDate,
                            time_slot: timeSlot,
                            reason: reason
                        }
                    }
                );


                /* -------------------------------
                   SUCCESS
                -------------------------------- */

                showMessage(
                    "ok",
                    "Appointment requested! Status: Pending. We will confirm shortly."
                );


                appointmentForm.reset();


                slotSelect.innerHTML =
                    '<option value="">-- Select time --</option>';


            } catch (error) {

                console.error(error);

                showMessage(
                    "err",
                    error.message ||
                    "Unable to book appointment."
                );


                loadSlots();

            }


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }
    );


    /* -------------------------------
       START
    -------------------------------- */

    loadDoctors();

});

</script>

</body>
</html>
