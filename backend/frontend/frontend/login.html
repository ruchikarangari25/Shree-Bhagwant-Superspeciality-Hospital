<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HMS Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="center-wrap">
  <div class="card narrow">
    <h2 style="text-align:center">HMS Login</h2>
    <p style="text-align:center;color:var(--mute);font-size:13px;margin-bottom:18px">Hospital Management System</p>
    <div id="msg" class="msg"></div>
    <form id="f">
      <div class="field"><label>Email Address</label><input id="email" type="email" placeholder="you@bhagwant.com" required></div>
      <div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter your password" required></div>
      <button class="btn" style="width:100%;justify-content:center">Sign In</button>
    </form>
    <div class="demo">
      <p style="text-align:center;color:var(--mute);font-size:12px;margin-top:18px">Demo Credentials</p>
      <button data-e="admin@bhagwant.com" data-p="admin123"><b>Admin Login</b><br>admin@bhagwant.com</button>
      <button data-e="amit@bhagwant.com" data-p="doctor123"><b>Dr. Amit Padwal</b><br>amit@bhagwant.com</button>
      <button data-e="sumit@bhagwant.com" data-p="doctor123"><b>Dr. Sumit Padwal</b><br>sumit@bhagwant.com</button>
    </div>
    <p style="text-align:center;font-size:13px;margin-top:14px">Want to book an appointment? <a href="book.html"><b>Click here</b></a></p>
  </div>
</div>
<script src="js/api.js"></script>
<script>
const msg = document.getElementById('msg');
document.querySelectorAll('.demo button').forEach(b => b.onclick = () => {
  email.value = b.dataset.e; password.value = b.dataset.p;
});
f.onsubmit = async e => {
  e.preventDefault();
  try {
    const r = await api('/login', { method: 'POST', body: { email: email.value.trim(), password: password.value } });
    Auth.set(r);
    location.href = r.role === 'admin' ? 'admin.html' : 'doctor.html';
  } catch (err) { showMsg(msg, 'err', err.message); }
};
</script>
</body>
</html>
